name: Build Nightly APK

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica il codice sorgente
        uses: actions/checkout@v5

      - name: Configura Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.x

      - name: Configura Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configura Android SDK
        uses: android-actions/setup-android@v3

      - name: Installa Cordova Globalmente
        run: npm install -g cordova

      - name: Installa Dipendenze e Compila APK
        run: |
          npm install
          cordova platform add android || true
          cordova build android

      - name: Salva l'APK generato
        uses: actions/upload-artifact@v5
        with:
          name: waistline-nightly-apk
          path: platforms/android/app/build/outputs/apk/debug/app-debug.apk
